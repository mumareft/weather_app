
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Weather Planner</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
        <h1>Travel Weather Planner</h1>

        <p>Find out what to pack for your trip!</p>

        <label for="city">Enter a city: </label>
        <!-- v-model -->
        <input
            type="text"
            id="city"
            v-model="city"
            placeholder="e.g. Dublin"
        >

        <!-- moustache syntax {{}} -->
        <p>You entered: {{ city }}</p>  

        <!-- v-on -->
        <button v-on:click="checkWeather">
            Check Weather!
        </button>
        <p v-if="message">
            {{ message }}
        </p>

        <h2>3-Day Forecast</h2>

        <table border="1">
            <thead>
                <tr>
                    <th>Date & Time</th>
                    <th>Temperature</th>
                    <th>Wind Speed</th>
                </tr>
            </thead>
            <!-- v-for -->
            <tbody>
                <tr v-for="day in forecast.slice(0, 3)":key="day.dt">
                    <td>{{ day.dt_txt }}</td>
                    <td>{{ day.main.temp }}°C</td>
                    <td>{{ day.wind.speed }} m/s</td>
                </tr>
            </tbody>
        </table>

    </div>
    <script src="app.js"></script>
</body>
</html>
